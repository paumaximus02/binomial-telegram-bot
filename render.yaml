services:
  - type: worker
    name: binomial-telegram-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: ALLOWED_GROUP_IDS
        sync: false
